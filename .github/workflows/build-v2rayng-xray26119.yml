name: Build v2rayNG 2.3.15 with Xray-core 26.11.9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Fetch original v2rayNG 2.3.15 and all submodules
        uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          ref: 2.3.15
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK, build tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools' 'ndk;30.0.16248370'
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Compile native HEV libraries (upstream script)
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Use official AndroidLibXrayLite v26.11.9 AAR
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p V2rayNG/app/libs
          curl --fail --location --retry 3 \
            --output V2rayNG/app/libs/libv2ray.aar \
            'https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar'
          unzip -t V2rayNG/app/libs/libv2ray.aar >/dev/null
          unzip -Z1 V2rayNG/app/libs/libv2ray.aar | grep -q '^jni/arm64-v8a/.*\.so$'
          echo 'AndroidLibXrayLite v26.11.9 library downloaded and archive validated.'
          sha256sum V2rayNG/app/libs/libv2ray.aar

      - name: Select upstream NDK version
        shell: bash
        working-directory: upstream/V2rayNG
        run: |
          set -euo pipefail
          sed -i '/compileSdk = 37/a\    ndkVersion = "30.0.16248370"' app/build.gradle.kts
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Build debug APK (arm64-v8a, signed with debug key)
        shell: bash
        working-directory: upstream/V2rayNG
        run: |
          set -euo pipefail
          ./gradlew :app:assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a --no-daemon

      - name: Validate resulting APK
        shell: bash
        working-directory: upstream/V2rayNG
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo 'Expected one arm64-v8a APK, found:'
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          unzip -t "${apks[0]}" >/dev/null
          unzip -Z1 "${apks[0]}" | grep -q '^lib/arm64-v8a/.*\.so$'
          echo 'APK archive validated:'
          ls -lh "${apks[0]}"
          sha256sum "${apks[0]}"

      - name: Upload ready-to-install APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-2.3.15-Xray-26.11.9-arm64-debug
          path: upstream/V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7
